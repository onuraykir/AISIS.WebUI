<div class="login">
  <div class="login__card">
    <img
      class="login__logo"
      src="images/cankaya-logo.png"
      alt="Çankaya Üniversitesi"
      width="72"
      height="72"
    />

    <h1 class="login__title">AISIS</h1>
    <p class="login__subtitle">Çankaya Üniversitesi</p>

    <p class="login__note">
      Giriş ekranının tasarımı ayrıca yapılacak. Bu yer tutucu, şablonun
      giriş/çıkış akışını denemek için duruyor.
    </p>

    <button type="button" class="login__button" (click)="signIn()">
      <i class="pi pi-sign-in" aria-hidden="true"></i>
      Örnek kullanıcı ile gir
    </button>
  </div>
</div>
